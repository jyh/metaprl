name: Build

# Builds MetaPRL from a clean checkout with libmojave's master beside it
# (metaprl/libmojave is a link to ../libmojave, as in a developer tree),
# on OCaml 4.14 and 5.4 with camlp5 8, then runs the shell tests in
# editor/ml/tests. mk/defaults' CAML_VERSIONS must name the exact
# versions the matrix below pins (4.14.4, 5.4.1).
#
# Scope, stated: Ubuntu only; the default configuration (THEORIES =
# itt/core, COMPILATION_MODE = mixed, so the shell is bytecode); SSL off.
# A manual run can choose the refiner's sequent sets (SEQ_SET, mk/defaults:
# Lm_array). The weekly run (Monday 07:00 UTC, an hour after the Windows
# census) replays every stored proof with SEQ_SET = Lm_splay and skips the
# build job, so libmojave's Lm_splay_linear_set stays exercised end to end
# (its defects fixed in libmojave #46 and #56 were found this way). Every
# other run uses the default.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      seq_set:
        description: the refiner's sequent sets (SEQ_SET)
        type: choice
        options: [Lm_array, Lm_splay]
        default: Lm_array

env:
  SEQ_SET: ${{ inputs.seq_set || (github.event_name == 'schedule' && 'Lm_splay') || 'Lm_array' }}

permissions:
  contents: read

jobs:
  build:
    name: build and test (OCaml ${{ matrix.ocaml }}, camlp5 8)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ocaml: ["4.14.4", "5.4.1"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: metaprl
      - uses: actions/checkout@v4
        with:
          repository: jyh/libmojave
          ref: master
          path: libmojave
      - run: sudo apt-get update && sudo apt-get install -y libncurses-dev libreadline-dev
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
      - run: opam install -y omake.0.10.7 ocamlfind camlp5.8.05.02 camlp-streams
      - name: configure
        working-directory: metaprl
        run: |
          ln -s ../libmojave libmojave
          printf 'CAMLP5 = camlp5\nSSL_ENABLED = false\n' > mk/config.local
          # The first run writes mk/config and stops (mk/load_config).
          opam exec -- omake --no--progress
          sed -i "s/^SEQ_SET = .*/SEQ_SET = $SEQ_SET/" mk/config
          grep -q "^SEQ_SET = $SEQ_SET\$" mk/config
          grep -E '^(THEORIES|COMPILATION_MODE|SSL_ENABLED|SEQ_SET) ' mk/config
      - name: build
        working-directory: metaprl
        run: opam exec -- omake -k -j4 --no--progress
      - name: stored proofs that carry ~labels load (editor/ml/tests/old_labels.sh)
        working-directory: metaprl
        run: opam exec -- sh editor/ml/tests/old_labels.sh
      - name: the shell reads a one-argument minus as negation (editor/ml/tests/toploop_minus.sh)
        working-directory: metaprl
        run: opam exec -- sh editor/ml/tests/toploop_minus.sh
      - name: an INSTALL_DIR with a space stays one THEORYPATH entry (editor/ml/tests/install_dir_space.sh)
        working-directory: metaprl
        run: opam exec -- sh editor/ml/tests/install_dir_space.sh
      - name: omake install works with a space in INSTALL_DIR (editor/ml/tests/install_space.sh)
        working-directory: metaprl
        run: opam exec -- sh editor/ml/tests/install_space.sh
      - name: the build leaves the tree clean
        working-directory: metaprl
        run: |
          git status --short > "$RUNNER_TEMP/status.txt"
          if [ -s "$RUNNER_TEMP/status.txt" ]; then cat "$RUNNER_TEMP/status.txt"; echo "FAIL: the build left untracked or modified files"; exit 1; fi

  proofs:
    # Builds every theory in THEORIES_ALL (native) and replays every stored
    # proof, comparing each rule's status and rule-box count with
    # editor/ml/tests/proof_census.expected, on the same exact OCaml
    # versions as the build job: a proof whose replay depends on the
    # compiler (hash or table order inside a tactic) shows as a difference
    # between the two legs.
    name: replay every stored proof (OCaml ${{ matrix.ocaml }}, THEORIES = all)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ocaml: ["4.14.4", "5.4.1"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: metaprl
      - uses: actions/checkout@v4
        with:
          repository: jyh/libmojave
          ref: master
          path: libmojave
      - run: sudo apt-get update && sudo apt-get install -y libncurses-dev libreadline-dev
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
      - run: opam install -y omake.0.10.7 ocamlfind camlp5.8.05.02 camlp-streams
      - name: configure (THEORIES = all, native)
        working-directory: metaprl
        run: |
          ln -s ../libmojave libmojave
          printf 'CAMLP5 = camlp5\nSSL_ENABLED = false\n' > mk/config.local
          # The first run writes mk/config and stops (mk/load_config).
          opam exec -- omake --no--progress
          sed -i 's/^THEORIES = .*/THEORIES = all/; s/^COMPILATION_MODE = .*/COMPILATION_MODE = native/' mk/config
          sed -i "s/^SEQ_SET = .*/SEQ_SET = $SEQ_SET/" mk/config
          grep -q "^SEQ_SET = $SEQ_SET\$" mk/config
          grep -E '^(THEORIES|COMPILATION_MODE|SEQ_SET) ' mk/config
      - name: build
        working-directory: metaprl
        run: opam exec -- omake -k -j4 --no--progress
      - name: replay every stored proof (editor/ml/tests/proof_census.sh)
        working-directory: metaprl
        run: opam exec -- sh editor/ml/tests/proof_census.sh
