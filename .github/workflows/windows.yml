name: Windows

# A MEASUREMENT, not a gate: builds MetaPRL on Windows (setup-ocaml, MinGW
# and MSVC) with libmojave's master inside the tree, to learn what breaks.
# The job is allowed to fail (continue-on-error), so a red leg here does not
# make the workflow red. Each step runs with `omake -k` and the build log is
# uploaded as an artifact. Scope: the default configuration (THEORIES =
# itt/core, COMPILATION_MODE = mixed), SSL, readline and ncurses off (mk/
# load_config turns readline and ncurses off on Win32).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build on Windows (OCaml ${{ matrix.ocaml }}, ${{ matrix.compiler }}; allowed to fail)
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        ocaml: ["4.14.4", "5.4.1"]
        compiler: [mingw, msvc]
    defaults:
      run:
        shell: bash
    env:
      # mk/defaults falls back to the registry's ProgramFilesDir ("C:\Program
      # Files") for INSTALL_DIR, and the space splits THEORYPATH in mk/make_config
      # (measured, round 2). Set it to a path without a space.
      INSTALL_DIR: D:/mpinstall
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: metaprl
      - uses: actions/checkout@v4
        with:
          repository: jyh/libmojave
          ref: master
          path: metaprl/libmojave
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          windows-compiler: ${{ matrix.compiler }}
      # Measured on the first run (OCaml 5.4.1): omake 0.10.7 failed to bootstrap
      # (MinGW: its vendored libmojave calls the removed failwith/invalid_argument;
      # MSVC: cl lacks C11 atomics), and camlp5's conf-perl-ipc-system-simple and
      # conf-perl-string-shellquote failed. The steps below measure each separately.
      # Round 2: `perl` on PATH is Strawberry Perl, while opam's builds run
      # Cygwin's /usr/bin/perl, so the modules go into Cygwin's perl.
      - name: the two perl modules camlp5 needs, into Cygwin's perl (from CPAN)
        continue-on-error: true
        # Round 3: Cygwin's perl does not exist until opam installs it as the
        # system dependency of conf-perl, so install that first.
        run: |
          opam install -y conf-perl 2>&1 | tail -5 | tee "$RUNNER_TEMP/perl.log"
          /usr/bin/perl -v | sed -n 2p | tee -a "$RUNNER_TEMP/perl.log"
          PERL_MM_USE_DEFAULT=1 /usr/bin/perl -MCPAN -e 'CPAN::Shell->notest(install => q(IPC::System::Simple), q(String::ShellQuote))' 2>&1 | tail -40 | tee -a "$RUNNER_TEMP/perl.log"
          /usr/bin/perl -MIPC::System::Simple -MString::ShellQuote -e 'print "perl modules OK\n"' 2>&1 | tee -a "$RUNNER_TEMP/perl.log"
      - name: install omake
        continue-on-error: true
        run: |
          set -o pipefail
          if ! opam install -y omake.0.10.7 2>&1 | tee "$RUNNER_TEMP/opam-omake.log"; then
            echo "omake.0.10.7 failed; trying upstream ocaml-omake master"
            opam pin add -y omake git+https://github.com/ocaml-omake/omake.git#master 2>&1 | tee "$RUNNER_TEMP/opam-omake-master.log"
          fi
      - name: install ocamlfind and camlp5
        continue-on-error: true
        run: |
          set -o pipefail
          opam install -y ocamlfind camlp5.8.05.02 camlp-streams 2>&1 | tee "$RUNNER_TEMP/opam-camlp5.log"
      - name: configure
        working-directory: metaprl
        run: |
          printf 'CAMLP5 = camlp5\nSSL_ENABLED = false\n' > mk/config.local
          # The first run writes mk/config and stops (mk/load_config).
          opam exec -- omake --no--progress 2>&1 | tee "$RUNNER_TEMP/configure.log" || true
          grep -E '^(THEORIES|COMPILATION_MODE|SSL_ENABLED|READLINE_ENABLED|NCURSES_ENABLED)' mk/config
      - name: build
        working-directory: metaprl
        run: |
          set -o pipefail
          opam exec -- omake -k -j4 --no--progress 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: summarise the build log
        if: always()
        run: |
          f="$RUNNER_TEMP/build.log"
          test -f "$f" || { echo "no build log"; exit 0; }
          echo "lines: $(wc -l < "$f")"
          echo "--- first 40 error lines"
          grep -n -E 'rror|\*\*\* omake' "$f" | head -40 || true
          echo "--- tail"
          tail -40 "$f"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.ocaml }}-${{ matrix.compiler }}-logs
          path: ${{ runner.temp }}/*.log
